name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.shell }})
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]   # Windows PowerShell 5.1 and PowerShell 7
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4

      - name: Install test tools
        run: |
          $ProgressPreference = 'SilentlyContinue'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Install-Module Pester -MinimumVersion 5.5.0 -Force -Scope CurrentUser -SkipPublisherCheck
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $PSVersionTable.PSVersion

      - name: Static analysis
        run: |
          $findings = Invoke-ScriptAnalyzer -Path .\DiskSpaceTriage.ps1 -Settings .\PSScriptAnalyzerSettings.psd1
          $findings | Format-Table RuleName, Severity, Line, Message -AutoSize -Wrap | Out-String -Width 220
          if (@($findings | Where-Object Severity -in 'Error', 'ParseError').Count -gt 0) { throw 'PSScriptAnalyzer reported errors.' }

      - name: Unit, oracle and capability tests
        run: |
          Import-Module Pester -MinimumVersion 5.5.0
          $config = New-PesterConfiguration
          $config.Run.Path = 'tests'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Normal'
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputPath = "test-results-${{ matrix.shell }}.xml"
          Invoke-Pester -Configuration $config

      - name: Self-test (rules, report, off-screen window)
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'selftest'
          # Hosted runners are administrators, so the elevation guard must be overridden here.
          & .\DiskSpaceTriage.ps1 -Mode SelfTest -ReportDirectory $out -AllowElevated
          Get-ChildItem $out | Format-Table Name, Length

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.shell }}
          path: |
            test-results-*.xml
            ${{ runner.temp }}/selftest/*
          if-no-files-found: warn

  volume:
    name: Actions free real space on a test volume (${{ matrix.shell }})
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Pester
        run: |
          $ProgressPreference = 'SilentlyContinue'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Install-Module Pester -MinimumVersion 5.5.0 -Force -Scope CurrentUser -SkipPublisherCheck

      - name: Create two throw-away NTFS volumes (virtual disks)
        run: |
          $used  = [System.IO.DriveInfo]::GetDrives() | ForEach-Object { $_.Name.Substring(0, 1) }
          $spare = @('S', 'T', 'U', 'V', 'W', 'X', 'Y') | Where-Object { $used -notcontains $_ } | Select-Object -First 2
          if (@($spare).Count -ne 2) { throw 'No two spare drive letters.' }
          $labels = @('TRIAGESRC', 'TRIAGEDST')
          foreach ($i in 0, 1) {
            $vhd = Join-Path $env:RUNNER_TEMP ("triage-$i.vhd")
            $script = @(
              "create vdisk file=`"$vhd`" maximum=2048 type=expandable",
              "select vdisk file=`"$vhd`"",
              'attach vdisk',
              'convert mbr',
              'create partition primary',
              "format fs=ntfs quick label=$($labels[$i])",
              "assign letter=$($spare[$i])"
            )
            $file = Join-Path $env:RUNNER_TEMP ("diskpart-$i.txt")
            Set-Content -LiteralPath $file -Value $script -Encoding ASCII
            diskpart /s $file
            if ($LASTEXITCODE -ne 0) { throw "diskpart failed for volume $i" }
          }
          Start-Sleep -Seconds 2
          foreach ($letter in $spare) {
            $d = New-Object System.IO.DriveInfo ($letter + ':\')
            "{0}: {1} {2} {3:N0} MB free" -f $letter, $d.DriveType, $d.DriveFormat, ($d.AvailableFreeSpace / 1MB)
            if ($d.DriveType -ne 'Fixed' -or $d.DriveFormat -ne 'NTFS') { throw "Volume $letter is not a fixed NTFS volume." }
          }
          "TRIAGE_VOLUME_SOURCE=$($spare[0])" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TRIAGE_VOLUME_DEST=$($spare[1])"   | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Delete, move a file, move a store - and measure the free space
        # A Windows dialog waiting for an answer would hang; fail fast instead.
        timeout-minutes: 6
        run: |
          Import-Module Pester -MinimumVersion 5.5.0
          $config = New-PesterConfiguration
          $config.Run.Path = 'tests/Volume.Tests.ps1'
          $config.Run.PassThru = $true
          $config.Output.Verbosity = 'Detailed'
          $result = Invoke-Pester -Configuration $config
          "Passed $($result.PassedCount), failed $($result.FailedCount), skipped $($result.SkippedCount)."
          if ($result.FailedCount -gt 0) { throw 'A volume test failed.' }
          # A skipped test here would mean the proof did not happen.
          if ($result.SkippedCount -gt 0 -or $result.PassedCount -lt 15) { throw 'The volume tests did not all run.' }

      - name: Detach the virtual disks
        if: always()
        run: |
          foreach ($i in 0, 1) {
            $vhd = Join-Path $env:RUNNER_TEMP ("triage-$i.vhd")
            if (Test-Path -LiteralPath $vhd) {
              $file = Join-Path $env:RUNNER_TEMP ("detach-$i.txt")
              Set-Content -LiteralPath $file -Value @("select vdisk file=`"$vhd`"", 'detach vdisk') -Encoding ASCII
              diskpart /s $file
            }
          }
          exit 0

  offline:
    name: Real scan with the network blocked
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4

      - name: Block all outbound traffic for PowerShell
        run: |
          Set-NetFirewallProfile -All -Enabled True
          $exe = (Get-Process -Id $PID).Path
          New-NetFirewallRule -DisplayName 'triage-ci-block-out' -Direction Outbound -Program $exe -Action Block | Out-Null
          $blocked = $false
          try { Invoke-WebRequest -Uri 'https://example.com' -UseBasicParsing -TimeoutSec 15 | Out-Null } catch { $blocked = $true }
          if (-not $blocked) { throw 'The firewall rule did not block outbound traffic; this job would prove nothing.' }
          Write-Host 'Outbound traffic from PowerShell is blocked.'

      - name: Console scan of the runner profile
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'scan'
          & .\DiskSpaceTriage.ps1 -Mode Console -MinSizeMB 50 -MaxDepth 8 -ReportDirectory $out -AllowElevated
          if (@(Get-ChildItem $out -Filter *.html).Count -ne 1) { throw 'No HTML report was produced.' }

      - name: Self-test
        run: |
          & .\DiskSpaceTriage.ps1 -Mode SelfTest -ReportDirectory (Join-Path $env:RUNNER_TEMP 'scan') -AllowElevated

      - name: Print the window screenshots (base64) for review from the log
        run: |
          foreach ($name in 'selftest-window.png', 'selftest-window-fix.png', 'selftest-window-delete.png', 'selftest-window-move.png', 'selftest-window-dark.png', 'selftest-window-dark-fix.png') {
            $png = Join-Path $env:RUNNER_TEMP "scan\$name"
            Write-Host "-----BEGIN PNG $name-----"
            [Convert]::ToBase64String([System.IO.File]::ReadAllBytes($png), 'InsertLineBreaks')
            Write-Host "-----END PNG $name-----"
          }

      - name: The self-test and the console scan changed no user variable
        run: |
          foreach ($name in 'HF_HOME', 'PIP_CACHE_DIR', 'TORCH_HOME', 'OLLAMA_MODELS', 'npm_config_cache') {
            if ([Environment]::GetEnvironmentVariable($name, 'User')) { throw "$name was set, but nothing asked for it." }
          }
          if (Test-Path 'D:\FromC') { throw 'D:\FromC exists, but nothing asked for it.' }
          Write-Host 'No variable set, no folder created.'

      - name: Refuses to run elevated without the override
        run: |
          powershell -NoProfile -File .\DiskSpaceTriage.ps1 -Mode Console
          if ($LASTEXITCODE -ne 2) { throw "Expected exit code 2 from the elevation guard, got $LASTEXITCODE." }
          Write-Host 'Elevation guard works.'
          exit 0

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-scan
          path: ${{ runner.temp }}/scan/*
          if-no-files-found: warn
